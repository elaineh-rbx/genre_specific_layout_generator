[project]
name = "genre-specific-layout-generator"
version = "0.1.0"
description = "Turn a game prompt into a layout-correct scene, guided by genre rules"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "numpy>=1.24",
    "httpx>=0.27",
    "matplotlib>=3.8",
]

[project.scripts]
gslg-serve = "gslg.web.server:main"
gslg-card = "gslg.evaluate.card:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gslg*"]

[tool.ruff]
line-length = 90
