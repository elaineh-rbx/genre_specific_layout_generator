[project]
name = "genre-specific-layout-generator"
version = "0.1.0"
description = "Turn a game prompt into a layout-correct scene, guided by genre rules"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "numpy>=1.24",
    "httpx>=0.27",
    "matplotlib>=3.8",
    # The repulsive-curves centreline under layoutgen/layouts/repulsive/. scipy solves
    # the saddle-point system each step; numba compiles the tangent-point kernels,
    # without which a track takes minutes rather than seconds. Both are needed to
    # author a racing circuit, which is the default for every closed Racing shape.
    "scipy>=1.10",
    "numba>=0.58",
    "gepa>=0.1.4",
]

# Only `tools/check_pages.py` needs a browser, and nothing that generates a scene does.
# Installing it is a choice, so a machine that only runs the pipeline stays small:
#   uv sync --extra check && python -m playwright install --with-deps chromium
[project.optional-dependencies]
check = ["playwright>=1.62"]

[project.scripts]
layoutgen-serve = "layoutgen.web.server:main"
layoutgen-card = "layoutgen.evaluate.card:main"
layoutgen-optimize-gemini = "layoutgen.optimize.gepa_images:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["layoutgen*"]

[tool.ruff]
line-length = 90

# Copied verbatim from rschmidt/trackgen so they can still be diffed against it when
# that repo moves. Tidying their imports and casts would buy nothing and cost the
# only thing that makes a vendored copy maintainable. The two modules in that package
# written here - `__init__` and `finalize` - are linted like everything else.
[tool.ruff.lint.per-file-ignores]
"layoutgen/layouts/repulsive/blob.py" = ["ALL"]
"layoutgen/layouts/repulsive/boundaries.py" = ["ALL"]
"layoutgen/layouts/repulsive/kernels.py" = ["ALL"]
"layoutgen/layouts/repulsive/optimizer.py" = ["ALL"]
"layoutgen/layouts/repulsive/rng.py" = ["ALL"]
"layoutgen/layouts/repulsive/shapes.py" = ["ALL"]
