<style>

<header>
  <h1>Genre layout options &amp; prompt injections</h1>
  <p>Build.md Part II. Each genre is a menu: one <b>shape</b>, any <b>options</b> on
  top, and a <b>preset</b> is a shape plus a few option IDs. Nothing is mandatory
  &mdash; picking nothing injects nothing.</p>
</header>

const DATA={"genres": [{"name": "Action", "num": 1, "desc": "fast-paced physical combat, arenas, and battlegrounds", "tagline": "Fast-paced physical combat and arenas", "route": "", "notes": ["Boundaries. Action is physical and melee-leaning; Shooter is about ranged sightlines and lane discipline. If the map is organized around firing corridors rather than a shared clash space, use Shooter. If there are formal scoring rules and a fixed field spec, it's Sports.", "Spawn safety is mostly inherited. Part I \u00a76 already mandates a hazard-free spawn isolated from gameplay risk, at 5\u00d75 studs per player slot. The Action-specific part is only the anti-camp placement \u2014 don't restate the baseline.", "Verticality is optional here and often assumed mandatory. A flat arena is a perfectly valid Action map. Terracing and multi-level catwalks are style choices with real pipeline cost, not requirements.", "Two options exist because the presets demanded them. Building the preset list surfaced that the genre could not express a hack-and-slash at all \u2014 no linear room-to-room form and no combat lock-in, despite both being staples. arena-chain and arena-lockin were added for it.", "Roblox's own subgenres for Action are Battlegrounds & Fighting, Music & Rhythm, and Open World Action. Two of the three are presets above. Music & Rhythm is usually a SET rather than a P5 \u2014 a rhythm game normally has a stage, a performer, and a crowd to look at even though the player never walks anywhere. Build that and skip the traversal checks. Only a bare note highway with no room behind it is P5.", "Battlegrounds is a Roblox-native format. The Strongest Battlegrounds effectively created it, and the flat bounded arena with ring-out edges is the shape the whole wave of imitators inherited. When a user asks for an anime fighting game, this is almost always the layout they are picturing."], "shapes": [{"id": "arena-flat", "label": "Flat Arena", "type": "CombatZone", "what": "A single lev .", "inject": "Natural landform shaping the ground: hills, mountains, cliffs, a valley, or a canyon.", "core": false, "goes": "image", "pipeline": "P0 + tiered", "shared": []}, {"id": "island-cluster", "label": "Island Cluster", "type": "Zone", "what": "Several separate landmasses with water or open air between them, crossed by bridge, boat, or flight.", "inject": "Several separate landmasses with water or open air between them, crossed by bridge, boat, or flight.", "core": false, "goes": "image", "pipeline": "CHECK", "shared": []}], "presets": [{"name": "Battlegrounds", "ref": "The Strongest Battlegrounds, Jujutsu Shenanigans (Roblox); Power Stone", "shape": "arena-flat", "shapeLabel": "Flat Arena", "options": ["hazard-kill", "spawn-protected", "cover-los"], "drawn": ["Ring-Out Edges", "Anti-Camp Placement", "Line-of-Sight Pillars"], "held": [], "route": ["P0"], "injection": "LAYOUT FEATURES for this Action map. Build these as the actual structure of the space rather than as set dressing, keep them visually distinct from one another, and keep the whole layout legible in one view.\n\nSHAPE OF THE SPACE - Flat Arena: A single level floor, free of minor tripping geometry, for the cleanest possible physics.\n\nINCLUDE:\n- Ring-Out Edges: Open edges or bottomless pits wrapping the arena, making aggressive positioning a real risk.\n- Anti-Camp Placement: Start areas set back, screened by walls or terrain, or raised above the arena floor.\n- Line-of-Sight Pillars: Large columns scattered across the floor, letting a retreating player break combat lock and heal."}, {"name": "Fighting", "ref": "For Honor, Chivalry; Untitled Boxing Game (Roblox)", "shape": "arena-flat", "shapeLabel": "Flat Arena", "options": ["spawn-protected", "cover-los", "choke-bottleneck"], "drawn": ["Anti-Camp Placement", "Line-of-Sight Pillars", "Conflict Chokepoint"], "held": [], "route": ["P0"], "injection": "LAYOUT FEATURES for this Action map. Build these as the actual structure of the space rather vement to climb). Other \u2014 maze, moving and rotating platforms and deadly objects, conveyors (which hinder by slowing the player or by making them too fast to judge jumps), tight rope, truss and ladder climbs, timed paths (disappear t* seconds after activation \u2014 beat-the-clock feel), disappearing paths (vanish after being stepped on \u2014 survival feel). Treat it as a toolkit, not a taxonomy.", "Classic vs bespoke. Difficulty-chart obbies reuse these blocks directly and repetitively. Modern bespoke obbies increasingly blend several into unique hand-built stage environments rather than repeating a fixed set \u2014 so don't assume a stage is one obstacle type.", "Most obbies aren't lethal on contact. Failure is usually falling into a void or timing out, not touching something deadly. Reserve hazard-kill for genuinely contact-lethal obstacles rather than applying it to every hazard.", "Checkpoints are near-universal but not universal. Very short courses and intentionally hardcore no-checkpoint obbies deliberately omit them.", "Two options exist because a dry run of the skill demanded them. Walking real prompts through the genre file surfaced that Obby could express neither the start hub with a shop \u2014 near-universal on Roblox and the thing a user means by \"and there's a shop town\" \u2014 nor the drivable roadway a Vehicle Obby obviously runs on, which left that preset building discrete platforms for cars. social-hub and path-road-vehicle were added for them, reusing the shared IDs so the concept dedupes cleanly when Obby is mixed with Roleplay or Simulation.", "Glitch obbies can't be validated. They rely on undocumented Humanoid state-machine timing \u2014 wallhopping, ladder flicking, corner clipping \u2014 rather than the documented physics baseline. Spacing can't be derived from Part I and the P6 generator can't check it; treat the structure as author-supplied.", "Co-op obbies break the \"own pace\" assumption. Balloon-and-holder and frog-and-tongue  If the loop is a defined, repeatable set of job tasks \u2014 pilot, doctor, trucker, farmer \u2014 it's Simulation's Role Sim bundle instead.", "Vehicle roads are conditional. 15- and 30-stud streets exist so car meshes can turn. A walking-only roleplay town doesn't need them, and Build's original version wrongly demanded them of every game in the genre.", "This genre is P3 by default in practice. Every housing model except Static Settlement involves enterable interiors, which is a real and unavoidable pipeline cost \u2014 worth surfacing to the user early rather than at build time.", "Roblox's own subgenres here are Animal Sim, Dress Up, Life, Morph Roleplay, and Pet Care \u2014 all five are presets above, and building them forced two shapes and one option that did not exist. An animal sim has no town, so it needed wilderness-open and den-shelter; a dress-up game has no settlement either, just a runway and preparation booths, so it needed stage-runway. The genre had silently assumed a human town.", "Two of the five presets are among the largest games on the platform. Adopt Me! and Dress to Impress are Pet Care and Dress Up respectively, so these are not fringe cases \u2014 they were simply unrepresented."], "shapes": [{"id": "settlement-static", "label": "Static Settlement", "type": "Zone", "what": "A fixed, pre-built town with no personal property at all; personalization happens through the avatar, never property.", "pipeline": ""}, {"id": "settlement-claimable", "label": "Claimable Houses", "type": "Zone", "what": "Pre-built houses scattered through the town that players claim rather than construct, customizing paint or swapping a preset interior.", "pipeline": "P3"}, {"id": "settlement-buildable", "label": "Personalized Plots", "type": "BuildZone", "what": "Uniform, flat, square lot footprints on a strict grid where players cleanly spawn and build their own houses.", "pipeline": "P3, plus P4 if interiors are per-player instances"}, {"id": "wilderness-open", "la hub"], "drawn": ["Scenic Backdrop", "Town Square Core"], "held": [], "route": ["P0"], "injection": "LAYOUT FEATURES for this Roleplay & Avatar Sim map. Build these as the actual structure of the space rather than as set dressing, keep them visually distinct from one another, and keep the whole layout legible in one view.\n\nSHAPE OF THE SPACE - Stage and Dressing Rooms: A judging runway or catwalk fed by preparation booths, with the audience arranged around it.\n\nINCLUDE:\n- Scenic Backdrop: Highly detailed spots \u2014 fountains, parks, beach boardwalks \u2014 built specifically as backgrounds for screenshots and roleplay scenes.\n- Town Square Core: A central, deliberately oversized gathering hub built to handle maximum avatar density without traffic jams."}]}, {"name": "Shooter", "num": 8, "desc": "competitive team deathmatches, Battle Royales, and PvE shooters", "tagline": "Competitive team deathmatches, tactical combat, and positioning", "route": "", "notes": ["References. Phantom Forces and Arsenal for arcade run-and-gun \u2014 by far the most common shooter style on the platform. BODYCAM: SWAT Simulator for MilSim.", "MilSim inverts the arcade assumptions. Slow, deliberate, high-punishment pacing instead of constant action. The map is a raid site built from rooms that dead-end into breach points, not a looping lane network \u2014 players clear in sequence rather than choosing between parallel lanes.", "Exposed chokepoints are the point in MilSim. Arcade cover is distributed evenly to keep fights constant; MilSim breach points are deliberately exposed because that tension is the design. Don't \"fix\" them.", "MilSim usually has no mirrored bases. It's typically squad-versus-objective PvE, or squad-versus-squad with one life. That implies one staging spawn per squad, not two symmetric respawning bases.", "Boundaries. Shooter organizes around firing corridors and sightlines; Action organizes around a shared clash space. Arcade shooters favor unrealistic interconnectedness \u2014 rooms with multiple exits \u2014 precisely to avoid the dead ends MilSim wants.", "Four options exist because the presets demanded them. The Genre List has always named Battle Royale and PvE shooters, and Roblox's official taxonomy has both as subgenres, yet the table could express neither \u2014 no contracting boundary, no scattered loot, no enemy emitter. boundary-shrinking, collectible-loot, powerup-buffs, and spawner-npc were added when the preset list made the gaps obvious.", "Roblox's own subgenres for Shooter are Battle Royale, Deathmatch Shooter, and PvE Shooter. That taxonomy is too coarse for layout: Team Deathmatch, Capture the Flag, King of the Hill, and free-for-all are all Deathmatch Shooter to Roblox but need four different maps. The presets use the standard mode names instead, which is the one place a Roblox subgenre name is deliberately not used.", "The contracting boundary is the cleanest example of an invisible pick. It has no geometry at all, so it cannot be segmented out of a render and must never enter the image prompt. It is computed and placed against the finished layout.", "Not every shooter is a match. The other eight presets are all competitive modes with two sides, so a solo aim-training range, a gun-testing place, or a target gallery had no preset at all and had to emit preset: null \u2014 a large Roblox category with nothing to land on. Aim Trainer is the single-player case: no opposing team, no route through the map, everything downrange of one firing line. range-directed is shared with Sports, where it is a bowling or archery lane; same shape, same P0, different words.", "A rail or gallery shooter is an Aim Trainer that moves the camera, not a P5. It has a real set \u2014 a firing line, targets, a backdrop \u2014 even though the player never walks. Build it and flag SET; see Pipeline costs in Build.md. Hero shooters are served by the King of the Hill preset today, but class-specific spawn rooms and ability-traversal geometry are not represented \u2014 flag it if one comes up."], "shapes": [{"id": "lane-network", "label": "Lane Network", "type": "Lane", "what": "Parallel routes, classically three, channelling team traffic into predictable engagement fronts.", "pipeline": ""}, {"id": "breach-sequence", "label": "Breach Sequence", "type": "Path", "what": "A raid site of rooms that dead-end into breach points, cleared in a defined order rather than looped.", "pipeline": ""}, {"id": "open-battlefield", "label": "Open Battlefield", "type": "Zone", "what": "One large contiguous map with dispersed points of interest instead of defined lanes.", "pipeline": ""}, {"id": "range-directed", "label": "Directed Practice Range", "type": "Lane", "what": "A firing line facing downrange into a target field, with no opposing team and no route through \u2014 everything the player shoots at is in front of them and the space behind the line is safe.", "pipeline": ""}], "options": [{"id": "cover-los", "label": "Tactical Cover Arrays", "type": "Cover", "what": "Waist-high (3\u20134 studs) and full-body (7\u20138 studs) cover distributed evenly across every lane.", "inject": "Waist-high (3\u20134 studs) and full-body (7\u20138 studs) cover distributed evenly across every lane.", "core": true, "goes": "image", "pipeline": "", "shared": ["Action", "Party & Casual", "Shooter", "Strategy", "Survival"]}, {"id": "spawn-teambase", "label": "Opposing Team Bases", "type": "SpawnZone", "what": "Balanced bases at opposite ends of the map, completely shielded from enemy sniper lines.", "inject": "Balanced bases at opposite ends of the map, each enclosed so it is not overlooked from open ground.", "core": true, "goes": "both", "pipeline": "", "shared": []}, {"id": "choke-bottleneck", "label": "Lane Pinch Point", "type": "Choke", "what": "Narrow transitions where lanes meet, concentrating fights into contested ground.", "inject": "Narrow transitions where lanes meet, concentrating fights into contested ground.", "cor her than scattered individual buildings.", "inject": "Built-up ground at a stated density \u2014 a hamlet, a town, or a dense city block grid \u2014 rather than scattered individual buildings.", "core": false, "goes": "image", "pipeline": "", "shared": []}, {"id": "terrain-relief", "label": "Terrain Relief", "type": "Zone", "what": "Natural landform shaping the ground: hills, mountains, cliffs, a valley, or a canyon.", "inject": "Natural landform shaping the ground: hills, mountains, cliffs, a valley, or a canyon.", "core": false, "goes": "image", "pipeline": "P0 + tiered", "shared": []}, {"id": "island-cluster", "label": "Island Cluster", "type": "Zone", "what": "Several separate landmasses with water or open air between them, crossed by bridge, boat, or flight.", "inject": "Several separate landmasses with water or open air between them, crossed by bridge, boat, or flight.", "core": false, "goes": "image", "pipeline": "CHECK", "shared": []}], "presets": [{"name": "Team Deathmatch", "ref": "Phantom Forces, Arsenal (Roblox); Call of Duty", "shape": "lane-network", "shapeLabel": "Lane Network", "options": ["spawn-teambase", "cover-los", "choke-bottleneck"], "drawn": ["Opposing Team Bases", "Tactical Cover Arrays", "Lane Pinch Point"], "held": [], "route": ["P0"], "injection": "LAYOUT FEATURES for this Shooter map. Build these as the actual structure of the space rather than as set dressing, keep them visually distinct from one another, and keep the whole layout legible in one view.\n\nSHAPE OF THE SPACE - Lane Network: Parallel routes, classically three, channelling team traffic into predictable engagement fronts.\n\nINCLUDE:\n- Opposing Team Bases: Balanced bases at opposite ends of the map, each enclosed so it is not overlooked from open ground.\n- Tactical Cover Arrays: Waist-high (3\u20134 studs) and full-body (7\u20138 studs) cover distributed evenly across every lane.\n- Lane Pinch Point: Narrow transitions where lanes meet, concentrating fights into contested ing fast players bypass the main-lane standoff.\n- Opposing Team Bases: Balanced bases at opposite ends of the map, each enclosed so it is not overlooked from open ground."}, {"name": "King of the Hill", "ref": "Halo, Battlefield Conquest", "shape": "lane-network", "shapeLabel": "Lane Network", "options": ["control-zone", "cover-elevated", "cover-los"], "drawn": ["Held Point", "Elevated Firing Position", "Tactical Cover Arrays"], "held": [], "route": ["P0", "tiered", "P2"], "injection": "LAYOUT FEATURES for this Shooter map. Build these as the actual structure of the space rather than as set dressing, keep them visually distinct from one another, and keep the whole layout legible in one view.\n\nSHAPE OF THE SPACE - Lane Network: Parallel routes, classically three, channelling team traffic into predictable engagement fronts.\n\nINCLUDE:\n- Held Point: A marked raised area - the King-of-the-Hill hill - visibly distinct from its surroundings.\n- Elevated Firing Position: Windows, towers, and nests reachable only through exposed, predictable stairs or ladders.\n- Tactical Cover Arrays: Waist-high (3\u20134 studs) and full-body (7\u20138 studs) cover distributed evenly across every lane."}, {"name": "Arena Deathmatch", "ref": "Quake, Doom", "shape": "lane-network", "shapeLabel": "Lane Network", "options": ["powerup-buffs", "cover-elevated", "path-loop"], "drawn": ["Elevated Firing Position", "Interconnected Rooms"], "held": ["Armour & Weapon Spawns"], "route": ["P0", "tiered", "P2"], "injection": "LAYOUT FEATURES for this Shooter map. Build these as the actual structure of the space rather than as set dressing, keep them visually distinct from one another, and keep the whole layout legible in one view.\n\nSHAPE OF THE SPACE - Lane Network: Parallel routes, classically three, channelling team traffic into predictable engagement fronts.\n\nINCLUDE:\n- Elevated Firing Position: Windows, towers, and nests reachable only through exposed, predictable stairs or ladders.\n- Interconnected Rooms: Rooms with two or more entrances and exits, favouring constant interconnectedness over realistic dead ends."}, {"name": "Tactical Shooter", "ref": "Rainbow Six Siege; BODYCAM: SWAT Simulator (Roblox)", "shape": "breach-sequence", "shapeLabel": "Breach Sequence", "options": ["building-interior", "cover-los"], "drawn": ["Breachable Structure", "Tactical Cover Arrays"], "held": [], "route": ["P3"], "injection": "LAYOUT FEATURES for this Shooter map. Build these as the actual structure of the space rather than as set dressing, keep them visually distinct from one another, and keep the whole layout legible in one view.\n\nSHAPE OF THE SPACE - Breach Sequence: A raid site of rooms that dead-end into breach points, cleared in a defined order rather than looped.\n\nINCLUDE:\n- Breachable Structure: A house, apartment, or compound entered from outside.\n- Tactical Cover Arrays: Waist-high (3\u20134 studs) and full-body (7\u20138 studs) cover distributed evenly across every lane."}, {"name": "PvE Shooter", "ref": "Left 4 Dead, Killing Floor", "shape": "lane-network", "shapeLabel": "Lane Network", "options": ["spawner-npc", "choke-bottleneck", "building-interior"], "drawn": ["Lane Pinch Point", "Breachable Structure"], "held": ["Enemy Wave Origin"], "route": ["P3"], "injection": "LAYOUT FEATURES for this Shooter map. Build these as the actual structure of the space rather than as set dressing, keep them visually distinct from one another, and keep the whole layout legible in one view.\n\nSHAPE OF THE SPACE - Lane Network: Parallel routes, classically three, channelling team traffic into predictable engagement fronts.\n\nINCLUDE:\n- Lane Pinch Point: Narrow transitions where lanes meet, concentrating fights into contested ground.\n- Breachable Structure: A house, apartment, or compound entered from outside."}, {"name": "Battle Royale", "ref": "PUBG, Fortnite, Apex Legends", "shape": "open-battlefield", "shapeLabel": "Open Battlefield", "options": ["boundary-shrinking", "collectible-loot", "building-interior"], "drawn": ["Breachable Structure"], "held": ["Closing Play Area", "Scattered Loot"], "route": ["P3"], "injection": "LAYOUT FEATURES for this Shooter map. Build these as the actual structure of the space rather than as set dressing, keep them visually distinct from one another, and keep the whole layout legible in one view.\n\nSHAPE OF THE SPACE - Open Battlefield: One large contiguous map with dispersed points of interest instead of defined lanes.\n\nINCLUDE:\n- Breachable Structure: A house, apartment, or compound entered from outside."}, {"name": "Aim Trainer", "ref": "Aimlabs, Kovaak's; Roblox aim-training and gun-testing places", "shape": "range-directed", "shapeLabel": "Directed Practice Range", "options": ["target-practice", "station-loadout"], "drawn": ["Practice Targets", "Weapon Bench"], "held": [], "route": ["P0"], "injection": "LAYOUT FEATURES for this Shooter map. Build these as the actual structure of the space rather than as set dressing, keep them visually distinct from one another, and keep the whole layout legible in one view.\n\nSHAPE OF THE SPACE - Directed Practice Range: A firing line facing downrange into a target field, with no opposing team and no route through \u2014 everything the player shoots at is in front of them and the space behind the line is safe.\n\nINCLUDE:\n- Practice Targets: Static and popping targets set at graded distances downrange \u2014 plates, silhouettes, bullseyes \u2014 arranged so the player can read which distance they are hitting.\n- Weapon Bench: A bench or rack behind the firing line where players pick and swap the weapon they are practising with."}]}, {"name": "Simulation", "num": 9, "desc": "tycoons, role and job sims, vehicle operation, and incremental/idle clicking", "tagline": "Tycoons, incremental clickers, role sims, and progressive managers", "route": "", "notes": ["References. 2 Player Secret Hideout Tycoon for shared plots. Ultimate Mining Tycoon for the extraction hybrid. Mega Miners for vehicle sim.", "Boundaries. Role Sim vs Roleplay & Avatar Sim: Role Sim is a defined, repeatable task loop; Roleplay is open-ended social storytelling. Vehicle Sim vs Racing: there is no lap or finish condition in a vehicle sim \u2014 players operate machinery cooperatively in a persistent world.", "The isolated plot is not universal, despite being the genre's mental default. Role Sim and Vehicle Sim have no plot at all; co-op tycoons share one; the extraction hybrid pairs a personal plot with a shared field. Check which before laying out a grid.", "The shared resource field is not a plot. In the extraction hybrid it's common ground the whole server mines and hauls from. Building it as somebody's plot breaks the loop.", "Role sims are often cooperative. A shared farm several players work together is more typical than per-player isolation \u2014 pilot, doctor, trucker, and medieval farmer sims all tend this way.", "The \"+1 speed\" family lives here, and it did not used to live anywhere. Walk or click to raise a stat, break through a barrier the stat unlocks, spend the winnings, rebirth for a multiplier \u2014 the number going up is the game. It is a large, well-known Roblox family, and in a 620-prompt evaluation its members scattered across four genres and five presets, because each instance looks locally like whatever it borrowed: a parkour course reads as Obby, a keyboard-escape puzzle reads as Puzzle, a racing lane reads as Racing. What they share is the layout, not the activity \u2014 tiers in a line, a wall between each pair, a training station you stand on, and a rebirth pad at the end. That is tier-ladder plus Stat Grinder, and it is P0.", "tier-ladder is not an obby, even when you jump on it. An obby's difficulty is in the geometry and the route has to be physics-legal, which is why Obby & Platformer routes P6 whatever shape it takes. Here the barrier is a number, the geometry is just ground, and nothing has to be validated \u2014 so a \"+1 speed\" game that also has a parkour section is Simulation first, and it stays P0. Naming Obby second is right; letting it lead is what imported a P6 these games never needed.", "gate-progression covers both kinds of wall. A tycoon's gate opens when you pay; a stat ladder's opens when you are fast enough. Same geometry, same ID, different sentence \u2014 bend the wording, do not add a row.", "Roblox's own subgenres here are Idle, Incremental Simulator, Physics Sim, Sandbox, Tycoon, and Vehicle Sim \u2014 the widest subgenre list of any genre, which matches how much this label covers. Five are presets above. Idle is a SET, not a P5. Roblox defines it as games with little to no player input, and the old rule read that as no layout job \u2014 but an idle game still has a space you watch, and most Roblox ones are a tycoon you happen to leave running. Build the set; see Pipeline costs in Build.md. Only route P5 when there is genuinely no room, just a screen of numbers.", "Physics Sim needed an option that did not exist. Ramps, ragdoll props, and breakable assemblies are the entire point of that subgenre, so physics-rig was added. It reuses Destructible, which Part I \u00a74 already governs through the debris rule."], "shapes": [{"id": "plot-isolated", "label": "Isolated Per-Player Plots", "type": "BuildZone", "what": "Massive, independent, equally spaced plots for building out a factory or base without ever overlapping a neighbour.", "pipeline": ""}, {"id": "plot-shared", "label": "Shared Team Plot", "type": "BuildZone", "what": "One right-sized plot shared by a team, with buttons and upgrades spread across the single structure benefiting everyone jointly.", "pipeline": ""}, {"id": "world-shared", "label": "Shared Persistent World", "type": "Zone", "what": "No personal plot at all \u2014 one common world everybody operates in together.", "pipeline": ""}, {"id": "world-underground", "label": "Surface and Underground Layers", "type": "Zone", "what": "A ment at all. Units path dynamically toward whatever they're attacking across open terrain. There is no winding enemy lane to build, so don't generate one \u2014 bases are distributed symmetrically instead.", "The core base reframes between styles. In tower defense it sits at the literal end of one enemy path, so it only needs defending from one approach. In RTS it's the fixed heart of a player's own territory with no lane funnelling attackers, so it has to be defensible from every direction.", "RTS placement is rule-gated, not grid-gated. Buildable land is usually constrained by proximity \u2014 must be near your own structures, can't be too close to an enemy's \u2014 rather than by a narrow strip flanking a lane.", "Why the track inverts the pipeline. A tower defense lane has to be one valid continuous route or the game doesn't function. An image can't guarantee that, so the lane is generated procedurally first and dressed after.", "Roblox's own subgenres here are Board & Card Games and Tower Defense, both presets above. Board & Card Games has the smallest layout job of anything in this document \u2014 a table, a board, and seating \u2014 but it is a layout, and board-grid is the original SET: real geometry that nobody walks on. Build it and skip the traversal checks. Only a board that is genuinely a flat UI surface with no room around it is P5.", "Two IDs are shared with other genres but written locally. tile-grid also appears in Party & Casual and collectible-nodes in five other genres. The ID is the dedupe key; the wording here is Strategy's own, because a contested ore site and an RPG herb patch are not described the same way even though a mixed-genre menu should only offer one of them."], "shapes": [{"id": "lane-actor-track", "label": "Enemy Lane", "type": "Path", "what": "A single continuous, unchanging lane winding from spawn to the core that enemy waves are hard-coded to follow \u2014 no dead-end branches, no ambiguous self-crossings.", "pipeline": "P6"}, { er", "num": 14, "desc": "procedural auto-runners centered on automated forward translation and reaction timing", "tagline": "Automated forward translation, reaction timing, and surviving a procedurally generated endless path", "route": "Genre route: P6. Procedural by nature \u2014 the layout is chunk rules, not a fixed map. Obstacle spacing must be elastic (spacing = CurrentSpeed \u00d7 0.5 s of reaction time) so every emitted sequence stays clearable as the player accelerates.", "notes": ["Boundaries. Forward motion is automatic and the path is endless. If the player controls their own speed, it's Racing; if they control their own movement over discrete jumps, it's Obby.", "Lane snap versus free lateral is the genre's real fork. Subway Surfers snaps between three fixed lanes; Temple Run steers continuously. They produce different chunk geometry, and the 3-lane assumption shouldn't be applied to both.", "Spacing must be elastic, not fixed. Players accelerate the further they get, so a gap authored in fixed studs becomes unclearable later in the run. Everything is derived from current speed against reaction time.", "Chunk pivots are the thing that breaks silently. If exit and origin pivots don't match exactly on one axis, the track drifts a little per chunk and the run degrades over minutes rather than failing visibly.", "Scope caveat on the cleanup volume. It's a placed volume, so it's arguably layout, but its justification is runtime memory management. Kept here framed by placement \u2014 how far behind the camera it sits \u2014 rather than by the memory concern, which is Mechanics.", "Roblox files Runner as a subgenre of Obby & Platformer, not as its own genre. Kept separate here because a runner routes P6 with elastic speed-derived spacing and shares almost none of its generation with a difficulty-chart obby. The skill should still recognise \"runner\" arriving as an obby request, since that is the wording Roblox's own taxonomy teaches creators."], "shapes": [{"i
